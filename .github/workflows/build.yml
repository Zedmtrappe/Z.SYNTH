name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (universal)
    # Universal (arm64 + x86_64) build: the runner architecture does not matter.
    # The Intel image avoids the long arm64 runner queues.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja || true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          D=dist/ZYNTH-macOS
          mkdir -p "$D/Plug-Ins"
          A=build/ZSynth_artefacts/Release
          cp -R "$A/Standalone/ZYNTH.app" "$D/"
          cp -R "$A/VST3/ZYNTH.vst3" "$D/Plug-Ins/"
          cp -R "$A/AU/ZYNTH.component" "$D/Plug-Ins/"
          cp packaging/macos/INSTALL.txt "$D/"
          cp packaging/macos/Install\ Plug-Ins.command "$D/"
          chmod +x "$D/Install Plug-Ins.command"
          # Ad-hoc signatures (not notarised): required for Apple Silicon to load them.
          codesign --force --deep --sign - "$D/ZYNTH.app"
          codesign --force --deep --sign - "$D/Plug-Ins/ZYNTH.vst3"
          codesign --force --deep --sign - "$D/Plug-Ins/ZYNTH.component"
          (cd dist && ditto -c -k --keepParent ZYNTH-macOS ZYNTH-macOS.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: ZYNTH-macOS
          path: dist/ZYNTH-macOS.zip

      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/ZYNTH-macOS/Plug-Ins/ZYNTH.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i zynth || true
          auval -strict -v aumu Zsy1 Zsyn

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libgl1-mesa-dev xvfb

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure
